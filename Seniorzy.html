<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kącik dla Mamy</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }
        h1 {
            color: #1a252f;
            font-size: 28px;
            margin-bottom: 25px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }
        .btn {
            border: none;
            border-radius: 18px;
            padding: 22px 15px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            width: 100%;
        }
        .btn-radio { background-color: #007bff; }
        .btn-relax { background-color: #28a745; }
        .btn-speech { background-color: #6f42c1; }
        .info-box {
            margin: 25px auto 0 auto;
            max-width: 450px;
            padding: 18px;
            background: #ffffff;
            border-radius: 14px;
            font-size: 18px;
            color: #333;
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <h1>☀️ Kącik dla Mamy</h1>

    <div class="grid">
        <button class="btn btn-radio" onclick="toggleRadio()">📻 Stare Przeboje (Radio)</button>
        <button class="btn btn-relax" onclick="toggleRain()">🌧️ Szum Deszczu (Relaks)</button>
        <button class="btn btn-speech" onclick="speakMessage()">🔊 Słowo na Dziś (Lektor)</button>
    </div>

    <div class="info-box" id="status">
        Kliknij przycisk powyżej!
    </div>

    <audio id="radioPlayer" src="https://stream.rmf.fm/rmf_fm"></audio>
    <audio id="rainPlayer" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>

    <script>
        const radio = document.getElementById('radioPlayer');
        const rain = document.getElementById('rainPlayer');
        const status = document.getElementById('status');

        function toggleRadio() {
            rain.pause();
            if (radio.paused) {
                radio.play().then(() => {
                    status.innerHTML = "▶️ Gra muzyka (RMF FM)";
                }).catch(err => {
                    status.innerHTML = "⚠️ Błąd włączenia radia. Sprawdź internet!";
                });
            } else {
                radio.pause();
                status.innerHTML = "⏹️ Radio wyłączone";
            }
        }

        function toggleRain() {
            radio.pause();
            if (rain.paused) {
                rain.play().then(() => {
                    status.innerHTML = "🌧️ Gra szum deszczu...";
                }).catch(err => {
                    status.innerHTML = "⚠️ Błąd dźwięku deszczu";
                });
            } else {
                rain.pause();
                status.innerHTML = "⏹️ Relaks wyłączony";
            }
        }

        function speakMessage() {
            window.speechSynthesis.cancel();
            const text = "Dzień dobry! Życzę Ci spokojnego i pięknego dnia. Odpocznij sobie i posłuchaj dobrej muzyki!";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
            status.innerHTML = "🔊 Lektor czyta wiadomość...";
        }
    </script>

</body>
</html>
