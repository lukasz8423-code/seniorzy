<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kącik dla Kobiety</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }
        h1 { color: #1a252f; font-size: 28px; margin-bottom: 25px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            text-decoration: none;
            border-radius: 18px;
            padding: 22px 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            width: 100%;
            text-align: center;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        .btn-rmf { background-color: #007bff; }
        .btn-pogoda { background-color: #17a2b8; }
        .btn-yt { background-color: #ff0000; }
        .btn-rain { background-color: #28a745; }
        .btn-speech { background-color: #6f42c1; }
        .info-box {
            margin: 25px auto 0 auto;
            max-width: 450px;
            padding: 18px;
            background: #ffffff;
            border-radius: 14px;
            font-size: 18px;
            color: #333;
            border: 2px solid #e2e8f0;
        }
        audio { display: none; }
    </style>
</head>
<body>

    <h1>☀️ Kącik dla Kobiety</h1>

    <div class="grid">
        <!-- RMF FM grany bezpośrednio na stronie -->
        <button class="btn btn-rmf" onclick="playAudio('https://stream.rmf.fm/rmf_fm', 'RMF FM')">📻 Włącz / Wyłącz RMF FM</button>

        <!-- Radio Pogoda grane bezpośrednio na stronie -->
        <button class="btn btn-pogoda" onclick="playAudio('https://stream.pogoda.audionow.pl/pogoda.mp3', 'Radio Pogoda')">🎶 Włącz / Wyłącz Radio Pogoda</button>

        <!-- Szum Deszczu bezpośrednio na stronie -->
        <button class="btn btn-rain" onclick="playAudio('https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', 'Szum Deszczu')">🌧️ Włącz / Wyłącz Szum Deszczu</button>

        <!-- Kazania ks. Pawlukiewicza na YouTube -->
        <a class="btn btn-yt" href="https://www.youtube.com/results?search_query=ks+piotr+pawlukiewicz+kazania">✝️ Kazania ks. Pawlukiewicza (YT)</a>

        <!-- Przycisk z lektorem -->
        <button class="btn btn-speech" onclick="speakMessage()">🔊 Słowo na Dziś</button>
    </div>

    <div class="info-box" id="status">
        Kliknij wybrany przycisk, aby włączyć audio!
    </div>

    <!-- Jeden wspólny odtwarzacz dźwięku na stronie -->
    <audio id="mainPlayer"></audio>

    <script>
        const player = document.getElementById('mainPlayer');
        const statusBox = document.getElementById('status');
        let activeUrl = '';

        function playAudio(url, name) {
            window.speechSynthesis.cancel();

            // Jeśli to samo gra - wyłącz
            if (activeUrl === url && !player.paused) {
                player.pause();
                player.src = '';
                activeUrl = '';
                statusBox.innerHTML = "⏹️ Wyłączono: " + name;
                return;
            }

            // Włącz nową ścieżkę
            statusBox.innerHTML = "⏳ Łączenie z " + name + "...";
            activeUrl = url;
            player.src = url;

            player.play().then(() => {
                statusBox.innerHTML = "▶️ Gra: " + name + " (kliknij ponownie, by wyłączyć)";
            }).catch(err => {
                console.error(err);
                statusBox.innerHTML = "⚠️ Kliknij przycisk jeszcze raz, aby uruchomić!";
            });
        }

        function speakMessage() {
            player.pause();
            player.src = '';
            activeUrl = '';
            window.speechSynthesis.cancel();

            const text = "Dzień dobry! Życzę Ci wspaniałego, spokojnego dnia i mnóstwa uśmiechu!";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;

            window.speechSynthesis.speak(utterance);
            statusBox.innerHTML = "🔊 Lektor czyta wiadomość...";
        }
    </script>

</body>
</html>
