<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kącik dla Mamy</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }
        h1 { color: #1a252f; font-size: 28px; margin-bottom: 20px; }
        .card {
            background: #ffffff;
            max-width: 450px;
            margin: 0 auto 20px auto;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
            border: 2px solid #e2e8f0;
        }
        .card h2 { font-size: 20px; color: #007bff; margin-top: 0; }
        iframe {
            width: 100%;
            height: 120px;
            border: none;
            border-radius: 12px;
        }
        .btn-speech {
            border: none;
            border-radius: 18px;
            padding: 18px 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #6f42c1;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            margin-top: 10px;
        }
        .info-box {
            margin: 15px auto 0 auto;
            max-width: 450px;
            padding: 15px;
            background: #e6fffa;
            border-radius: 12px;
            font-size: 16px;
            color: #234e52;
            border: 1px solid #b2f5ea;
        }
    </style>
</head>
<body>

    <h1>☀️ Kącik dla Mamy</h1>

    <!-- Radio w ramce - zero błędów i blokad -->
    <div class="card">
        <h2>📻 Stare Przeboje (Radio)</h2>
        <iframe src="https://rcs.rmfon.pl/pl/player/embed?id=3" title="RMF FM"></iframe>
    </div>

    <div class="card">
        <h2>🌧️ Szum Deszczu (Relaks)</h2>
        <iframe src="https://rcs.rmfon.pl/pl/player/embed?id=35" title="Radio z deszczem/relaks"></iframe>
    </div>

    <!-- Dodatkowy przycisk z lektorem -->
    <button class="btn-speech" onclick="speakMessage()">🔊 Słowo na Dziś</button>

    <div class="info-box" id="status">
        Wszystko gotowe! Klikaj śmiało w odtwarzacze powyżej.
    </div>

    <script>
        function speakMessage() {
            window.speechSynthesis.cancel();
            const text = "Dzień dobry! Życzę Ci spokojnego i pięknego dnia. Odpocznij sobie i posłuchaj dobrej muzyki!";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
            document.getElementById('status').innerHTML = "🔊 Lektor czyta wiadomość...";
        }
    </script>

</body>
</html>
