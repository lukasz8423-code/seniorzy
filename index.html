<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kącik dla Kobiety</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }
        h1 { color: #1a252f; font-size: 28px; margin-bottom: 25px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            text-decoration: none;
            border-radius: 18px;
            padding: 22px 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            width: 100%;
            text-align: center;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        .btn-rmf { background-color: #007bff; }
        .btn-pogoda { background-color: #17a2b8; }
        .btn-yt { background-color: #ff0000; }
        .btn-rain { background-color: #28a745; }
        .btn-speech { background-color: #6f42c1; }
        .info-box {
            margin: 25px auto 0 auto;
            max-width: 450px;
            padding: 18px;
            background: #ffffff;
            border-radius: 14px;
            font-size: 18px;
            color: #333;
            border: 2px solid #e2e8f0;
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <h1>☀️ Kącik dla Kobiety</h1>

    <div class="grid">
        <!-- RMF FM -->
        <a class="btn btn-rmf" href="https://www.rmfon.pl/play,5">📻 Włącz RMF FM</a>

        <!-- Radio Pogoda (Pewny link bezpośrednio do grającego serwisu) -->
        <a class="btn btn-pogoda" href="https://moje.radiopogoda.pl/radio">🎶 Włącz Radio Pogoda</a>

        <!-- Kazania ks. Pawlukiewicza na YouTube -->
        <a class="btn btn-yt" href="https://www.youtube.com/results?search_query=ks+piotr+pawlukiewicz+kazania">✝️ Kazania ks. Pawlukiewicza (YT)</a>

        <!-- Szum Deszczu bezpośrednio na stronie (bez otwierania stron) -->
        <button class="btn btn-rain" onclick="toggleRain()">🌧️ Szum Deszczu do Snu</button>

        <!-- Przycisk z lektorem -->
        <button class="btn btn-speech" onclick="speakMessage()">🔊 Słowo na Dziś</button>
    </div>

    <div class="info-box" id="status">
        Kliknij wybrany przycisk!
    </div>

    <!-- Odtwarzacz deszczu bezpośrednio w tle -->
    <audio id="rainAudio" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>

    <script>
        const rainAudio = document.getElementById('rainAudio');
        const statusBox = document.getElementById('status');

        function toggleRain() {
            window.speechSynthesis.cancel();
            if (rainAudio.paused) {
                rainAudio.play().then(() => {
                    statusBox.innerHTML = "🌧️ Szum deszczu gra... Kliknij ponownie, aby wyłączyć.";
                }).catch(err => {
                    statusBox.innerHTML = "⚠️ Kliknij przycisk deszczu jeszcze raz!";
                });
            } else {
                rainAudio.pause();
                statusBox.innerHTML = "⏹️ Wyłączono szum deszczu.";
            }
        }

        function speakMessage() {
            rainAudio.pause();
            window.speechSynthesis.cancel();
            const text = "Dzień dobry! Życzę Ci wspaniałego, spokojnego dnia i mnóstwa uśmiechu!";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
            statusBox.innerHTML = "🔊 Lektor czyta wiadomość...";
        }
    </script>

</body>
</html>
