<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kącik dla Kobiety</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }
        h1 { color: #1a252f; font-size: 28px; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            border-radius: 18px;
            padding: 20px 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            width: 100%;
            text-align: center;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            text-decoration: none;
        }
        .btn-rmf { background-color: #007bff; }
        .btn-pogoda { background-color: #17a2b8; }
        .btn-yt { background-color: #ff0000; }
        .btn-rain { background-color: #28a745; }
        .btn-speech { background-color: #6f42c1; }
        .info-box {
            margin: 20px auto 0 auto;
            max-width: 450px;
            padding: 18px;
            background: #ffffff;
            border-radius: 14px;
            font-size: 18px;
            color: #333;
            border: 2px solid #e2e8f0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>☀️ Kącik dla Kobiety</h1>

    <div class="grid">
        <!-- RMF FM -->
        <a class="btn btn-rmf" href="https://www.rmfon.pl/play,5" target="_blank">📻 Otwórz RMF FM</a>

        <!-- Radio Pogoda -->
        <a class="btn btn-pogoda" href="https://www.radiopogoda.pl" target="_blank">🎶 Otwórz Radio Pogoda</a>

        <!-- Kazania ks. Pawlukiewicza -->
        <a class="btn btn-yt" href="https://www.youtube.com/results?search_query=ks+piotr+pawlukiewicz+kazania" target="_blank">✝️ Kazania ks. Pawlukiewicza (YT)</a>

        <!-- Szum Deszczu -->
        <a class="btn btn-rain" href="https://www.youtube.com/results?search_query=szum+deszczu+do+snu" target="_blank">🌧️ Szum Deszczu do Snu (YT)</a>

        <!-- Przycisk z lektorem -->
        <button class="btn btn-speech" onclick="speakMessage()">🔊 Słowo na Dziś</button>
    </div>

    <div class="info-box" id="status">
        Kliknij „Słowo na Dziś” albo wybraną stację!
    </div>

    <script>
        const quotes = [
            "Dzień dobry! Pamiętaj, że każdy nowy dzień to nowa szansa na uśmiech i spokój w sercu.",
            "Witaj! Niech dzisiejszy dzień przyniesie Ci mnóstwo radości, dobrej energii i odpoczynku.",
            "Dzień dobry! Zrób sobie pyszną herbatkę lub kawę i spędź ten dzień bez pośpiechu.",
            "Wspaniałego dnia! Bądź dla siebie dobra i pamiętaj, że małe przyjemności tworzą piękny dzień.",
            "Dzień dobry! Życzę Ci dzisiaj dużo słońca w sercu, miłych chwil i wspaniałej muzyki.",
            "Witaj serdecznie! Pamiętaj, że jesteś wyjątkowa. Życzę Ci spokojnego i udanego dnia.",
            "Dzień dobry! Odrzuć wszystkie troski na bok i ciesz się dzisiejszym pięknym dniem."
        ];

        function speakMessage() {
            window.speechSynthesis.cancel();
            
            // Losowe słowo na dziś na każdy dzień / kliknięcie
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            
            const utterance = new SpeechSynthesisUtterance(randomQuote);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;

            window.speechSynthesis.speak(utterance);
            document.getElementById('status').innerHTML = "🔊 <b>Słowo na dziś:</b><br>\"" + randomQuote + "\"";
        }
    </script>

</body>
</html>
