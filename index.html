<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kącik dla Kobiety</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }
        h1 { color: #1a252f; font-size: 28px; margin-bottom: 25px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            text-decoration: none;
            border-radius: 18px;
            padding: 22px 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            width: 100%;
            text-align: center;
        }
        .btn-rmf { background-color: #007bff; }
        .btn-pogoda { background-color: #17a2b8; }
        .btn-yt { background-color: #ff0000; }
        .btn-rain { background-color: #28a745; }
        .btn-speech { 
            background-color: #6f42c1; 
            border: none; 
            cursor: pointer; 
            font-family: Arial, sans-serif;
        }
        .info-box {
            margin: 25px auto 0 auto;
            max-width: 450px;
            padding: 18px;
            background: #ffffff;
            border-radius: 14px;
            font-size: 18px;
            color: #333;
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <h1>☀️ Kącik dla Kobiety</h1>

    <div class="grid">
        <!-- RMF FM -->
        <a class="btn btn-rmf" href="https://www.rmfon.pl/play,5" target="_blank">📻 Włącz RMF FM</a>

        <!-- Radio Pogoda -->
        <a class="btn btn-pogoda" href="https://radiopogoda.pl/sluchaj" target="_blank">🎶 Włącz Radio Pogoda</a>

        <!-- Kazania ks. Pawlukiewicza na YouTube -->
        <a class="btn btn-yt" href="https://www.youtube.com/results?search_query=ks+piotr+pawlukiewicz+kazania" target="_blank">✝️ Kazania ks. Pawlukiewicza (YT)</a>

        <!-- Szum Deszczu na YouTube -->
        <a class="btn btn-rain" href="https://www.youtube.com/results?search_query=szum+deszczu+do+snu" target="_blank">🌧️ Szum Deszczu do Snu</a>

        <!-- Przycisk z lektorem -->
        <button class="btn btn-speech btn" onclick="speakMessage()">🔊 Słowo na Dziś</button>
    </div>

    <div class="info-box" id="status">
        Kliknij wybrany przycisk!
    </div>

    <script>
        function speakMessage() {
            window.speechSynthesis.cancel();
            const text = "Dzień dobry! Życzę Ci wspaniałego, spokojnego dnia i mnóstwa uśmiechu!";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
            document.getElementById('status').innerHTML = "🔊 Lektor czyta wiadomość...";
        }
    </script>

</body>
</html>
